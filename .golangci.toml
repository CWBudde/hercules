version = "2"

[linters]
default = 'all'
disable = [
    'depguard',
    'exhaustive',
    'exhaustruct',
    'gocyclo',
    'godox',
    'gomodguard',
    'ireturn',
    'mnd',
    'musttag',
    'nlreturn',
    'sqlclosecheck',
    'wsl',
]
enable = ['gomodguard_v2', 'wsl_v5', "revive"]

[linters.settings]
[linters.settings.errcheck]
# Blank assignments are the required call-site marker for intentionally
# discarded errors; unassigned error returns remain repository-wide failures.
check-blank = false

[linters.settings.testpackage]
# Unit tests deliberately exercise package-private implementation details.
skip-regexp = '.*_test\.go$'

[linters.settings.testifylint]
# Tests intentionally use non-fatal error assertions when collecting multiple
# independent failures in one run.
disable = ['require-error']

[linters.settings.cyclop]
max-complexity = 10

[linters.settings.funlen]
lines = 60
statements = 40
ignore-comments = true

[linters.settings.gocognit]
min-complexity = 15

[linters.settings.nestif]
min-complexity = 4

[linters.settings.tagliatelle]
[linters.settings.tagliatelle.case]
[linters.settings.tagliatelle.case.rules]
json = 'camel'

[linters.settings.varnamelen]
ignore-names = ['rx', 'tx', 'db', 'ok', 'mw', 'gw', 'rt', 'id']
ignore-decls = ['w http.ResponseWriter', 'r *http.Request', 'g *Gateway']

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
disable = ['decl']

[linters.settings.revive]
[[linters.settings.revive.rules]]
name = "file-length-limit"

[[linters.settings.revive.rules.arguments]]
max = 1500
skip-comments = false
skip-blank-lines = false
[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy']
# internal/test is shared test scaffolding (a fixture-repository helper), not
# production code, so it is exempt from the strict `default = all` house style.
paths = ['third_party$', 'builtin$', 'examples$', 'internal/test/']

[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G601:'

# Reviewed CI-03 baseline: these exact unexported helpers are dormant
# compatibility/reference implementations retained from the renderer migration.
# Keep the symbol list explicit so newly unused production code still fails CI.
[[linters.exclusions.rules]]
linters = ['unused']
path = '^internal/render/'
text = 'func (runAllModes|plotFileCoupling|plotShotnessCoupling|calculateParallelismMetrics|plotLanguageEvolution|plotIntBars|plotFloatBars|plotRuntimePercentageMatplotlib|saveRuntimeFigure|plotCollectedSentimentTimeline|plotSentimentOverview|plotSentimentByType|plotSentimentForType|createReader) is unused'

[[linters.exclusions.rules]]
linters = ['gochecknoglobals', 'gochecknoinits']
path = 'cmd/.*\.go'

# These are deliberate public process-wide APIs: the pipeline registry is the
# plugin registration point, while the version variables are read by clients
# and BinaryGitHash is populated by the linker.
[[linters.exclusions.rules]]
linters = ['gochecknoglobals']
path = '(^|/)(core|version|internal/core/registry)\.go$'
text = '(Registry|BinaryGitHash|BinaryVersion) is a global variable'

[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'cmd/.*\.go'

# cmd/ is CLI glue; inline error handling is its established style and wsl's
# blank-line demands there conflict with gofumpt.
[[linters.exclusions.rules]]
linters = ['noinlineerr', 'wsl_v5']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['revive']
path = 'internal/common/fs_operations.go'
text = 'avoid meaningless package names'

# Opinionated readability/complexity linters target production code; they are
# noise in tests (and wsl conflicts with gofumpt's blank-line handling).
[[linters.exclusions.rules]]
linters = ['wsl_v5', 'varnamelen', 'funlen', 'cyclop', 'gocognit', 'gocyclo', 'maintidx', 'dupl']
path = '_test\.go'

# Tests commonly depend on shared package-level state and fixture repositories,
# so parallel execution is not a project-wide safe default.
[[linters.exclusions.rules]]
linters = ['paralleltest']
path = '_test\.go'

# Test fixtures intentionally assert the concrete values returned through the
# pipeline's any-typed compatibility API; a mismatch already fails the test.
[[linters.exclusions.rules]]
linters = ['forcetypeassert']
path = '_test\.go'

# These comments and expected strings are compact snapshots of the line-history
# tree. Keeping each snapshot on one line makes state transitions comparable.
[[linters.exclusions.rules]]
linters = ['lll']
path = 'internal/linehistory/file_test\.go'

# This legacy integration suite intentionally keeps its shared stateful fixture
# tests together; production files remain subject to revive's length limit.
[[linters.exclusions.rules]]
linters = ['revive']
path = 'leaves/burndown_legacy_test\.go'
text = 'file-length-limit'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'godox']
severity = 'info'

[formatters]
enable = ['gci', 'gofumpt', 'goimports']

[formatters.settings.gci]
sections = ['standard', 'default', 'prefix(github.com/cwbudde/hercules)']
custom-order = true

[formatters.settings.gofumpt]
module-path = 'github.com/cwbudde/hercules'
extra-rules = true

[formatters.settings.goimports]
local-prefixes = ['github.com/cwbudde/hercules']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$']
