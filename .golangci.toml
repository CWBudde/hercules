version = "2"

[linters]
default = 'all'
disable = [
    'depguard',
    'exhaustive',
    'exhaustruct',
    'gocyclo',
    'godox',
    'gomodguard',
    'ireturn',
    'mnd',
    'musttag',
    'nlreturn',
    'sqlclosecheck',
    'wsl',
]
enable = ['gomodguard_v2', 'wsl_v5', "revive"]

[linters.settings]
[linters.settings.wrapcheck]
# wrapcheck cannot tell this module's own packages from third-party ones, so it
# reports every error crossing an internal package boundary. Those errors are
# already contextualised where they originate, and re-wrapping each of the
# one-line dispatch arms in internal/render would only repeat the mode name.
# Genuinely foreign errors (os, encoding/json, image/png, matplotlib-go) are
# still reported and still wrapped.
ignore-package-globs = ['github.com/cwbudde/hercules/*']

[linters.settings.goconst]
# Table-driven fixtures repeat mode names and expected payload keys by design;
# hoisting them behind constants would hide what each case actually asserts.
ignore-tests = true

[linters.settings.errcheck]
# Blank assignments are the required call-site marker for intentionally
# discarded errors; unassigned error returns remain repository-wide failures.
check-blank = false

[linters.settings.testpackage]
# Unit tests deliberately exercise package-private implementation details.
skip-regexp = '.*_test\.go$'

[linters.settings.testifylint]
# Tests intentionally use non-fatal error assertions when collecting multiple
# independent failures in one run.
disable = ['require-error']

[linters.settings.cyclop]
max-complexity = 10

[linters.settings.funlen]
lines = 60
statements = 40
ignore-comments = true

[linters.settings.gocognit]
min-complexity = 15

[linters.settings.nestif]
min-complexity = 4

[linters.settings.tagliatelle]
[linters.settings.tagliatelle.case]
[linters.settings.tagliatelle.case.rules]
json = 'camel'

[linters.settings.varnamelen]
# The renderer is plotting and geometry code: `ax` is the matplotlib-go axes
# handle (the name it carries in matplotlib-go itself), x/y/x1..y2/px/py/dx/dy
# are coordinates, a/b/c/d are polynomial coefficients, and bg/bw are the
# background and border width. Spelling these out obscures the formula rather
# than explaining it.
ignore-names = [
    'rx', 'tx', 'db', 'ok', 'mw', 'gw', 'rt', 'id',
    'ax', 'x', 'y', 'z', 'w', 'h', 'i', 'j', 'k', 'n',
    'a', 'b', 'c', 'd', 'r', 'g', 'f', 'v', 't', 's', 'm', 'o',
    'dx', 'dy', 'dt', 'x1', 'x2', 'y1', 'y2', 'v2', 'px', 'py',
    'bg', 'bw', 'gs', 'ts', 'tm', 'wi',
]
ignore-decls = ['w http.ResponseWriter', 'r *http.Request', 'g *Gateway']

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
disable = ['decl']

[linters.settings.revive]
[[linters.settings.revive.rules]]
name = "file-length-limit"

[[linters.settings.revive.rules.arguments]]
max = 1500
skip-comments = false
skip-blank-lines = false
[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy']
# internal/test is shared test scaffolding (a fixture-repository helper), not
# production code, so it is exempt from the strict `default = all` house style.
paths = ['third_party$', 'builtin$', 'examples$', 'internal/test/']

[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G601:'

# Reviewed CI-03 baseline: these exact unexported helpers are dormant
# compatibility/reference implementations retained from the renderer migration.
# Keep the symbol list explicit so newly unused production code still fails CI.
[[linters.exclusions.rules]]
linters = ['unused']
path = '^internal/render/'
text = 'func (runAllModes|plotFileCoupling|plotShotnessCoupling|calculateParallelismMetrics|plotLanguageEvolution|plotIntBars|plotFloatBars|plotRuntimePercentageMatplotlib|saveRuntimeFigure|plotCollectedSentimentTimeline|plotSentimentOverview|plotSentimentByType|plotSentimentForType|createReader) is unused'

[[linters.exclusions.rules]]
linters = ['gochecknoglobals', 'gochecknoinits']
path = 'cmd/.*\.go'

# These are deliberate public process-wide APIs: the pipeline registry is the
# plugin registration point, while the version variables are read by clients
# and BinaryGitHash is populated by the linker.
[[linters.exclusions.rules]]
linters = ['gochecknoglobals']
path = '(^|/)(core|version|internal/core/registry)\.go$'
text = '(Registry|BinaryGitHash|BinaryVersion) is a global variable'

# Package-level lookup tables: the mode dispatch/validation maps, the built-in
# colour palettes and themes, and the default size and limit tables. They are
# populated once and read-only thereafter, the same rationale as the pipeline
# Registry above.
[[linters.exclusions.rules]]
linters = ['gochecknoglobals']
path = '(^internal/render/|^internal/analysisio/)'

# Test fixtures share flag sets and corpus definitions across table-driven cases.
[[linters.exclusions.rules]]
linters = ['gochecknoglobals']
path = '_test\.go'

[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'cmd/.*\.go'

# Test helpers raise one-off assertion errors that no caller inspects, and
# propagate os/png errors verbatim where the failure already names the fixture.
# The sentinel and wrapping conventions apply to production error paths.
[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = '_test\.go'

# The renderer is a port of Python `labours`: its modes write their textual
# report, progress lines and "chart saved to ..." notices to stdout, and
# cmd/labours prints its theme and mode listings. That output is the product,
# not a debug trace. Everywhere else a stray fmt.Print still fails.
[[linters.exclusions.rules]]
linters = ['forbidigo']
path = '(^internal/render/|^cmd/labours/)'

# Geometry and colour helpers return several same-typed values, and the result
# names are the only thing distinguishing (left, right, bottom, top) or
# (background, foreground) from each other. None of these use naked returns or
# mutate results in a defer, so nakedret still covers the actual hazard.
[[linters.exclusions.rules]]
linters = ['nonamedreturns']
path = '(^internal/render/|^cmd/labours/|_test\.go)'

# These struct tags are pinned to formats outside this repository: user-authored
# theme files that theme_manager round-trips by name, the documented JSON
# analysis output that downstream tools parse, and the committed
# test/corpus/baseline.json manifest. camelCase remains the default for new types.
[[linters.exclusions.rules]]
linters = ['tagliatelle']
path = '(internal/render/graphics/theme\.go|internal/render/modes/ownership\.go|internal/render/dispatch_test\.go|test/corpus/corpus_test\.go)'

# cmd/ is CLI glue; inline error handling is its established style and wsl's
# blank-line demands there conflict with gofumpt.
[[linters.exclusions.rules]]
linters = ['noinlineerr', 'wsl_v5']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['revive']
path = 'internal/common/fs_operations.go'
text = 'avoid meaningless package names'

# Opinionated readability/complexity linters target production code; they are
# noise in tests (and wsl conflicts with gofumpt's blank-line handling).
[[linters.exclusions.rules]]
linters = ['wsl_v5', 'varnamelen', 'funlen', 'cyclop', 'gocognit', 'gocyclo', 'maintidx', 'dupl']
path = '_test\.go'

# Tests commonly depend on shared package-level state and fixture repositories,
# so parallel execution is not a project-wide safe default.
[[linters.exclusions.rules]]
linters = ['paralleltest']
path = '_test\.go'

# Test fixtures intentionally assert the concrete values returned through the
# pipeline's any-typed compatibility API; a mismatch already fails the test.
[[linters.exclusions.rules]]
linters = ['forcetypeassert']
path = '_test\.go'

# Reader mocks stub out the whole Reader interface; the methods a test does not
# exercise return (nil, nil) on purpose rather than inventing sentinel errors.
[[linters.exclusions.rules]]
linters = ['nilnil']
path = '_test\.go'

# These fixtures are deliberately non-ASCII: they pin the rune-safe truncation
# and collision behaviour of the output-path slugger.
[[linters.exclusions.rules]]
linters = ['gosmopolitan']
path = 'internal/render/outputpath/outputpath_test\.go'

# These comments and expected strings are compact snapshots of the line-history
# tree. Keeping each snapshot on one line makes state transitions comparable.
[[linters.exclusions.rules]]
linters = ['lll']
path = 'internal/linehistory/file_test\.go'

# The theme table is dense tabular data: each theme is one row of rgba() columns
# and the palette is a single aligned list. Wrapping them would destroy the
# alignment that makes the themes comparable at a glance.
[[linters.exclusions.rules]]
linters = ['lll']
path = 'internal/render/graphics/theme\.go'

# Legacy integration suites keep their shared stateful fixtures together;
# production files remain subject to revive's length limit.
[[linters.exclusions.rules]]
linters = ['revive']
path = '_test\.go'
text = 'file-length-limit'

# This legacy integration suite intentionally keeps its shared stateful fixture
# tests together; production files remain subject to revive's length limit.
[[linters.exclusions.rules]]
linters = ['revive']
path = 'leaves/burndown_legacy_test\.go'
text = 'file-length-limit'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'godox']
severity = 'info'

[formatters]
enable = ['gci', 'gofumpt', 'goimports']

[formatters.settings.gci]
sections = ['standard', 'default', 'prefix(github.com/cwbudde/hercules)']
custom-order = true

[formatters.settings.gofumpt]
module-path = 'github.com/cwbudde/hercules'
extra-rules = true

[formatters.settings.goimports]
local-prefixes = ['github.com/cwbudde/hercules']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$']
