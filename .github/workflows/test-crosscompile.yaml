name: test-crosscompile

on:
  workflow_call:

permissions:
  contents: read

jobs:
  hercules-crosscompile:
    name: hercules cross-compile (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "*/*.sum"

      - name: Build cmd/hercules and cmd/labours without cgo (${{ matrix.target.goos }}/${{ matrix.target.goarch }})
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
        run: |
          go build ./cmd/hercules
          go build ./cmd/labours

  no-cgo-tests:
    name: unit tests with CGO_ENABLED=0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "*/*.sum"

      - name: Run unit tests without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  rbtree-cgo-optin:
    name: rbtree cgo LZ4 opt-in tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "*/*.sum"

      - name: Test rbtree with cgo LZ4 path
        run: go test -tags cgo_lz4 ./internal/rbtree
