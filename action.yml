name: "Hercules Git Archaeology"
description: "Run various Git history analyses with CWBudde/hercules"
author: "CWBudde"

inputs:
  args-json:
    description: >-
      Preferred Hercules argv as a JSON string array. When set, this replaces
      the deprecated whitespace-split args input.
    required: false
    default: ""
  args:
    description: >-
      Deprecated Hercules arguments, split on whitespace without shell
      evaluation. Use args-json when an argument contains whitespace.
    required: false
    default: "--burndown --burndown-people --devs --couples --temporal-activity"
  output:
    description: "Output file for analysis results"
    required: false
    default: "analysis.yml"
  generate-charts:
    description: "Generate visualization charts using labours"
    required: false
    default: "true"
  labours-mode:
    description: "Labours visualization mode (all, burndown, couples, temporal-activity, etc.)"
    required: false
    default: "all"
  best-effort-charts:
    description: "Do not fail the Action when chart generation fails or produces no PNG/SVG files"
    required: false
    default: "false"

outputs:
  analysis-file:
    description: "Path to the generated analysis YAML file"
    value: ${{ steps.analyze.outputs.file }}
  charts-archive:
    description: "Path to the tar archive containing charts"
    value: "hercules_charts.tar"

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Install Just
      uses: extractions/setup-just@v2

    - name: Build Hercules and Labours
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        CGO_ENABLED: "0"
        GOFLAGS: -mod=mod
      run: |
        set -euo pipefail
        just
        go build -o hercules-action ./cmd/hercules-action

    - name: Run Analysis
      id: analyze
      shell: bash
      env:
        HERCULES_ACTION_RUNNER: ${{ github.action_path }}/hercules-action
        HERCULES_ACTION_HERCULES: ${{ github.action_path }}/hercules
        HERCULES_ACTION_REPOSITORY: ${{ github.workspace }}
        HERCULES_ACTION_ARGS_JSON: ${{ inputs.args-json }}
        HERCULES_ACTION_ARGS: ${{ inputs.args }}
        HERCULES_ACTION_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        "$HERCULES_ACTION_RUNNER" analyze

    - name: Generate Charts
      if: inputs.generate-charts == 'true'
      shell: bash
      env:
        HERCULES_ACTION_RUNNER: ${{ github.action_path }}/hercules-action
        HERCULES_ACTION_LABOURS: ${{ github.action_path }}/labours
        HERCULES_ACTION_OUTPUT: ${{ inputs.output }}
        HERCULES_ACTION_LABOURS_MODE: ${{ inputs.labours-mode }}
        HERCULES_ACTION_BEST_EFFORT_CHARTS: ${{ inputs.best-effort-charts }}
      run: |
        set -euo pipefail
        rm -f hercules_charts.tar

        if ! "$HERCULES_ACTION_RUNNER" charts; then
          if [[ "$HERCULES_ACTION_BEST_EFFORT_CHARTS" == "true" ]]; then
            echo "::warning::Labours chart generation failed"
          else
            exit 1
          fi
        fi

        shopt -s nullglob
        chart_files=(*.png *.svg)
        if (( ${#chart_files[@]} == 0 )); then
          if [[ "$HERCULES_ACTION_BEST_EFFORT_CHARTS" == "true" ]]; then
            echo "::warning::No PNG or SVG charts were generated"
          else
            echo "No PNG or SVG charts were generated" >&2
            exit 1
          fi
        else
          tar -cf hercules_charts.tar -- "${chart_files[@]}"
        fi

    - name: Summary
      shell: bash
      env:
        HERCULES_ACTION_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        {
          printf '%s\n\n' "### Hercules Analysis Complete :chart_with_upwards_trend:"
          printf '**Analysis file**: \x60%s\x60\n' "$HERCULES_ACTION_OUTPUT"
          if [[ -f hercules_charts.tar ]]; then
            printf '**Charts archive**: \x60hercules_charts.tar\x60\n'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

branding:
  color: blue
  icon: activity
