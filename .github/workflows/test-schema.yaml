name: test-schema

on:
  workflow_call:

permissions:
  contents: read

jobs:
  schema-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "*/*.sum"

      - name: Setup pinned protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "3.20.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated protobuf and plugin output
        run: |
          set -euo pipefail

          tool_bin=$(go env GOPATH)/bin
          GOBIN="$tool_bin" go install github.com/gogo/protobuf/protoc-gen-gogo@v1.3.2
          PATH="$tool_bin:$PATH" protoc \
            --gogo_out=paths=source_relative:internal/pb \
            --proto_path=internal/pb internal/pb/pb.proto
          git diff --exit-code -- internal/pb/pb.pb.go

          generated="$PWD/.generated-plugin"
          trap 'rm -rf "$generated" /tmp/hercules-generated-plugin-first' EXIT
          PATH="$tool_bin:$PATH" CGO_ENABLED=0 go run ./cmd/hercules \
            generate-plugin --name ExamplePlugin --output "$generated"
          cp -a "$generated" /tmp/hercules-generated-plugin-first
          PATH="$tool_bin:$PATH" CGO_ENABLED=0 go run ./cmd/hercules \
            generate-plugin --name ExamplePlugin --output "$generated"
          diff -ru /tmp/hercules-generated-plugin-first "$generated"
          make -C "$generated"

      - name: Check PB schema compatibility against base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          base=""
          zero="0000000000000000000000000000000000000000"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "${EVENT_BEFORE:-}" ] && [ "$EVENT_BEFORE" != "$zero" ] \
              && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          elif git rev-parse -q --verify origin/main >/dev/null 2>&1 \
              && [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            base=$(git merge-base origin/main HEAD)
          fi

          if [ -z "$base" ]; then
            echo "No base commit to compare against (first push?); skipping."
            exit 0
          fi
          echo "Comparing PB schema against base $base"

          baseline=$(mktemp)
          if ! git show "$base:internal/pb/pb.schema.json" > "$baseline" 2>/dev/null; then
            echo "No pb.schema.json at base commit; skipping."
            exit 0
          fi

          changelog_flag=""
          if ! git diff --quiet "$base" HEAD -- docs/SCHEMA_CHANGELOG.md; then
            changelog_flag="-changelog-updated"
          fi

          go run ./cmd/schema-guard -old "$baseline" $changelog_flag
