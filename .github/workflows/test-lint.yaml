name: test-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # only-new-issues diffs against the base, which needs full history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "*/*.sum"

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Check tidy
        run: |
          just check-tidy

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        # CGO_ENABLED=0 matches the project's cgo-free build: with cgo, linting
        # tries to compile matplotlib-go's FreeType backend (ft2build.h) and
        # fails to typecheck. v2.12.2 provides gomodguard_v2 and is built with a
        # Go version new enough to analyze this module. only-new-issues keeps the
        # pre-existing `default = all` debt from blocking while flagging regressions.
        env:
          CGO_ENABLED: "0"
          GOFLAGS: -mod=mod
        with:
          version: v2.12.2
          only-new-issues: true
          args: --config ./.golangci.toml --timeout 5m
