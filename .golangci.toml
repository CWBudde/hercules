version = "2"

[linters]
default = 'all'
disable = [
    'depguard',
    'exhaustive',
    'exhaustruct',
    'gocyclo',
    'godox',
    'gomodguard',
    'ireturn',
    'mnd',
    'musttag',
    'nlreturn',
    'sqlclosecheck',
    'wsl',
]
enable = ['gomodguard_v2', 'wsl_v5', "revive"]

[linters.settings]
[linters.settings.cyclop]
max-complexity = 10

[linters.settings.funlen]
lines = 60
statements = 40
ignore-comments = true

[linters.settings.gocognit]
min-complexity = 15

[linters.settings.nestif]
min-complexity = 4

[linters.settings.tagliatelle]
[linters.settings.tagliatelle.case]
[linters.settings.tagliatelle.case.rules]
json = 'camel'

[linters.settings.varnamelen]
ignore-names = ['rx', 'tx', 'db', 'ok', 'mw', 'gw', 'rt', 'id']
ignore-decls = ['w http.ResponseWriter', 'r *http.Request', 'g *Gateway']

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 2
disable = ['decl']

[linters.settings.revive]
[[linters.settings.revive.rules]]
name = "file-length-limit"

[[linters.settings.revive.rules.arguments]]
max = 1500
skip-comments = false
skip-blank-lines = false
[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']
# internal/render and cmd/labours are the Go renderer moved verbatim from
# labours-go (PLAN.md Part A); excluded wholesale until brought up to house style.
# internal/test is shared test scaffolding (a fixture-repository helper), not
# production code, so it is exempt from the strict `default = all` house style.
paths = ['third_party$', 'builtin$', 'examples$', 'internal/render/', 'cmd/labours/', 'internal/test/']

[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G601:'

[[linters.exclusions.rules]]
linters = ['gochecknoglobals', 'gochecknoinits']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'cmd/.*\.go'

# cmd/ is CLI glue; inline error handling is its established style and wsl's
# blank-line demands there conflict with gofumpt.
[[linters.exclusions.rules]]
linters = ['noinlineerr', 'wsl_v5']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['revive']
path = 'internal/common/fs_operations.go'
text = 'avoid meaningless package names'

# Opinionated readability/complexity linters target production code; they are
# noise in tests (and wsl conflicts with gofumpt's blank-line handling).
[[linters.exclusions.rules]]
linters = ['wsl_v5', 'varnamelen', 'funlen', 'cyclop', 'gocognit', 'gocyclo', 'maintidx', 'dupl']
path = '_test\.go'

# These comments and expected strings are compact snapshots of the line-history
# tree. Keeping each snapshot on one line makes state transitions comparable.
[[linters.exclusions.rules]]
linters = ['lll']
path = 'internal/linehistory/file_test\.go'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'godox']
severity = 'info'

[formatters]
enable = ['gci', 'gofumpt', 'goimports']

[formatters.settings.gci]
sections = ['standard', 'default', 'prefix(github.com/cwbudde/hercules)']
custom-order = true

[formatters.settings.gofumpt]
module-path = 'github.com/cwbudde/hercules'
extra-rules = true

[formatters.settings.goimports]
local-prefixes = ['github.com/cwbudde/hercules']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$']
